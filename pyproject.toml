[project]
name = "adaptive-repository-agent"
version = "0.1.0"
description = "A LangGraph repository task agent with a reinforcement-learning routing policy."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["agentic-rl", "langchain", "langgraph", "q-learning", "streamlit"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "langchain>=1.3.0,<2.0.0",
    "langchain-openai>=1.3.0,<2.0.0",
    "langgraph>=1.2.0,<2.0.0",
    "pytest>=8.3.0,<10.0.0",
    "streamlit>=1.57.0,<2.0.0",
]

[project.scripts]
adaptive-repository-agent = "adaptive_agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0,<10.0.0",
    "ruff>=0.12.0,<1.0.0",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adaptive_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
